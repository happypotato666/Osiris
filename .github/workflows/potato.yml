name: Windows Build

on:
  workflow_dispatch:

# 💡 重點修正：加入環境變數強制允許或降回相容環境
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 💡 重點修正：將 actions 升級至支援新版 Node 的最新穩定版
    - name: Checkout code
      uses: actions/checkout@v4.2.2 

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Osiris
      run: |
        msbuild Osiris.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Osiris-DLL-Build
        path: |
          **/Release/*.dll
          **/x64/Release/*.dll
